<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Line Cargo - Tracking</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f3f4f6;
        }
        
        nav {
            background: #1e3a8a;
            padding: 1rem 2rem;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .nav-brand {
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .nav-links {
            display: flex;
            gap: 2rem;
        }
        
        .nav-links a {
            color: white;
            text-decoration: none;
        }
        
        .container {
            max-width: 800px;
            margin: 3rem auto;
            padding: 0 1rem;
        }
        
        .tracking-box {
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        h1 {
            color: #1e3a8a;
            margin-bottom: 0.5rem;
            font-size: 2.5rem;
        }
        
        .subtitle {
            color: #6b7280;
            margin-bottom: 2rem;
        }
        
        .tracking-input-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            justify-content: center;
        }
        
        .tracking-input {
            flex: 1;
            max-width: 400px;
            padding: 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
        }
        
        .tracking-input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        
        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }
        
        .btn-secondary {
            background: white;
            color: #1e3a8a;
            border: 2px solid #1e3a8a;
        }
        
        .btn-secondary:hover {
            background: #1e3a8a;
            color: white;
        }
        
        .appointment-section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #e5e7eb;
        }
        
        .appointment-text {
            color: #4b5563;
            margin-bottom: 1rem;
        }
        
        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }
        
        .modal-overlay.active {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal-container {
            background: #ffffff;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease;
        }
        
        .modal-header {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            color: white;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .modal-header h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }
        
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .modal-body {
            padding: 24px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #374151;
            font-weight: 500;
            font-size: 14px;
        }
        
        .optional {
            color: #9ca3af;
            font-weight: normal;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            box-sizing: border-box;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3b82f6;
        }
        
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .success-message {
            text-align: center;
            padding: 40px 20px;
            color: #059669;
        }
        
        .success-message h3 {
            margin-bottom: 10px;
            font-size: 24px;
        }
        
        @media (max-width: 640px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .tracking-input-group {
                flex-direction: column;
            }
            .tracking-input {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-brand">FLASH LINE CARGO</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="gallery.html">Gallery</a>
            <a href="tracking.html">Tracking</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <div class="container">
        <div class="tracking-box">
            <h1>Track Your Shipment</h1>
            <p class="subtitle">Enter your tracking number to get real-time updates</p>
            
            <div class="tracking-input-group">
                <input type="text" class="tracking-input" placeholder="Enter Tracking Number (e.g., FLC123456)">
                <button class="btn btn-primary" onclick="trackShipment()">Track</button>
            </div>
            
            <div class="appointment-section">
                <p class="appointment-text">Need to schedule a pickup or service?</p>
                <button class="btn btn-secondary" onclick="openModal()">Book Appointment</button>
            </div>
        </div>
    </div>

    <!-- Book Appointment Modal -->
    <div id="appointmentModal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h2>Book an Appointment</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            
            <div class="modal-body">
                <form action="https://formsubmit.co/flashlinecargokw@gmail.com" method="POST" id="bookingForm">
                    <!-- Disable FormSubmit reCAPTCHA -->
                    <input type="hidden" name="_captcha" value="false">
                    
                    <!-- Success page -->
                    <input type="hidden" name="_next" value="https://yourwebsite.com/tracking.html?booking=success">
                    
                    <!-- Email Subject -->
                    <input type="hidden" name="_subject" value="New Appointment Booking - Flash Line Cargo">
                    
                    <!-- Auto-response to customer (optional) -->
                    <input type="hidden" name="_autoresponse" value="Thank you for booking with Flash Line Cargo. We will contact you shortly to confirm your appointment.">
                    
                    <!-- Template for cleaner email -->
                    <input type="hidden" name="_template" value="table">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Full Name *</label>
                            <input type="text" id="name" name="name" required placeholder="Enter your full name">
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number *</label>
                            <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address <span class="optional">(Optional)</span></label>
                        <input type="email" id="email" name="email" placeholder="Enter your email address (optional)">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="service">Service Type *</label>
                            <select id="service" name="service" required>
                                <option value="">Select a service</option>
                                <option value="Cargo Tracking">Cargo Tracking</option>
                                <option value="Schedule Pickup">Schedule Pickup</option>
                                <option value="Delivery Booking">Delivery Booking</option>
                                <option value="Logistics Consultation">Logistics Consultation</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="date">Preferred Date *</label>
                            <input type="date" id="date" name="date" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="tracking_id">Tracking ID <span class="optional">(Optional)</span></label>
                        <input type="text" id="tracking_id" name="tracking_id" placeholder="Enter if related to existing shipment">
                    </div>

                    <div class="form-group">
                        <label for="message">Additional Message <span class="optional">(Optional)</span></label>
                        <textarea id="message" name="message" rows="3" placeholder="Tell us more about your requirements..."></textarea>
                    </div>

                    <button type="submit" class="submit-btn">Confirm Booking</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('appointmentModal').classList.add('active');
            document.body.style.overflow = 'hidden';
            
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('date').setAttribute('min', today);
        }

        function closeModal() {
            document.getElementById('appointmentModal').classList.remove('active');
            document.body.style.overflow = 'auto';
            document.getElementById('bookingForm').reset();
        }

        document.getElementById('appointmentModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Check for success parameter in URL (after FormSubmit redirect)
        if (window.location.search.includes('booking=success')) {
            alert('Booking Confirmed! We will contact you shortly.');
            // Clean URL
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        function trackShipment() {
            const input = document.querySelector('.tracking-input').value;
            if(input) {
                alert('Tracking: ' + input + '\n\n(This would show shipment details)');
            } else {
                alert('Please enter a tracking number');
            }
        }
    </script>
</body>
</html>
