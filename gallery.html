<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | Flash Line Cargo</title>

  <style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Montserrat:wght@900&display=swap');
  
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

   body {
      background: radial-gradient(circle at top, #1a3b5d, #0b1620 70%);
      color: #ffffff;
      overflow-x: hidden;
    }

    body.preload * {
      animation: none !important;
    }

    .fade-up {
      opacity: 0;
      transform: translateY(40px);
      animation: fadeUp 1.2s ease forwards;
    }

    .fade-delay-1 { animation-delay: 0.3s; }
    .fade-delay-2 { animation-delay: 0.6s; }
    .fade-delay-3 { animation-delay: 0.9s; }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* HEADER - Updated with tracking.html style */
    header {
      background: rgba(15, 32, 39, 0.6);
      backdrop-filter: blur(14px);
      padding: 20px 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      animation: slideDown 1s ease forwards;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-40px); }
      to { opacity: 1; transform: translateY(0); }
    }
	
    header .logo {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    header .logo img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      box-shadow: 0 0 25px rgba(255,204,0,0.8);
      animation: logoFloat 4s ease-in-out infinite;
    }

    @keyframes logoFloat {
      0% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0); }
    }

     header h1{
      font-family: 'Montserrat', sans-serif;
      font-size: 35px !important;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
	  
       /* Shine Animation Setup */
	background: linear-gradient(90deg, #ffcc00, #ffffff 50%, #ffcc00, #ff9900);
	background-size: 200% auto;  /* Makes gradient wider than text */
	-webkit-background-clip: text;
	-webkit-text-fill-color: transparent;
  
		/* Only this animation */
	animation: shine 3s linear infinite;
}

		/* Shine Keyframes */
	@keyframes shine {
	0% { background-position: 0% center; }
	100% { background-position: 200% center; }
}

   nav a {
      color: #eaeaea;
      text-decoration: none;
      margin-left: 30px;
      font-weight: 500;
      position: relative;
    }

    nav a::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -6px;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, #ffcc00, #ff9900);
      transition: width 0.3s ease;
    }

    nav a:hover::after { width: 100%; }

.page-hero{
  padding: 120px 40px 85px;
   text-align: center;
   position: relative;
   overflow: hidden;
   background-size: cover;
   background-position: center;
   background-repeat: no-repeat;
   transition: background-image 1.5s ease-in-out;
}

.page-hero h2{
	  font-size: 50px;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #ffcc00, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
}

.page-hero p {
      font-size: 20px;
      color: #ddd;
      margin-bottom: 40px;
    }
	
.section{
  padding:80px 40px;
  background:#fff;
}

.section.dark{background:#f4f4f4}

.section-title{
  text-align:center;
  color:#0f2027;
  font-size:40px;
  margin-bottom:50px;
}

.gallery-grid{
  max-width:1200px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:30px;
}

.gallery-item{
  position:relative;
  border-radius:20px;
  overflow:hidden;
  cursor:pointer;
  box-shadow:0 20px 40px rgba(0,0,0,.2);
}

.gallery-item img,
.gallery-item video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.gallery-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.7),transparent);
  opacity:0;
  display:flex;
  align-items:flex-end;
  padding:20px;
  transition:.3s;
}

.gallery-item:hover .gallery-overlay{opacity:1}

footer{
  background:#0b1620;
  padding:40px;
  text-align:center;
}

/* LIGHTBOX */
.lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}
.lightbox.active{
  opacity:1;
  pointer-events:auto;
}
.lightbox-content{
  max-width:90%;
  max-height:90%;
  position:relative;
}
.lightbox img,
.lightbox video{
  width:100%;
  max-height:90vh;
  border-radius:20px;
  box-shadow:0 0 60px rgba(255,204,0,.5);
}
.lightbox-close{
  position:absolute;
  top:-50px;
  right:0;
  font-size:40px;
  cursor:pointer;
  color:#fff;
}

   MOBILE RESPONSIVE FIX
   =============================== */

/* ---------- HERO TEXT ---------- */

.page-hero h2,

.hero p,

/* ---------- SERVICES ---------- */

  padding: 60px 20px;

/* ---------- ABOUT SPLIT ---------- */

  grid-template-columns: 1fr 1fr;

/* ---------- GALLERY ---------- */
.section{

}

.gallery-grid{
  grid-template-columns: 1fr;

/* ---------- FORMS ---------- */
.form-box{

input,select,textarea{

/* ---------- FLOATING BUTTONS ---------- */

.floating-btn{

/* ---------- MAP ---------- */
.master-map{

footer{

</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="images/logo.png" alt="Flash Line Cargo Service Logo">
    <h1>Flash Line Cargo <br>Service</h1>
  </div>
  <nav>
    <a href="home.html">Home</a>
    <a href="tracking.html">Tracking</a>
    <a href="gallery.html">Gallery</a>
    <a href="about.html">About Us</a>
    <a href="branches.html">Contact Us</a>
  </nav>
</header>

<section class="page-hero">
  <h2 class="fade-up fade-delay-1">Our Gallery</h2>
  <p class="fade-up fade-delay-2">Real customer. Real experience. </p>
</section>

<section class="section">
  <h2 class="section-title">Photo Gallery</h2>
  <div class="gallery-grid" id="photoGallery"></div>
</section>

<section class="section dark">
  <h2 class="section-title">Video Gallery</h2>
  <div class="gallery-grid" id="videoGallery"></div>
</section>

<!-- Footer Note -->
<footer>
  <p>© 2026 Flash Line Cargo Service. All Rights Reserved.</p>
  <p>
    Email:
    <a href="mailto:flashlinecargo@yahoo.com" style="color:#ffcc00;text-decoration:none;">
      flashlinecargo@yahoo.com
    </a>
    |
    Phone:
    <a href="tel:+96524758850" style="color:#ffcc00;text-decoration:none;">
      +965 2475 8850
    </a>
  </p>
</footer>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-content" id="lightboxContent">
    <span class="lightbox-close" id="lightboxClose">×</span>
  </div>
</div>

<script>
fetch('gallery.json')
.then(res=>res.json())
.then(data=>{

  const photos=document.getElementById('photoGallery');
  const videos=document.getElementById('videoGallery');
  const lightbox=document.getElementById('lightbox');
  const content=document.getElementById('lightboxContent');
  const close=document.getElementById('lightboxClose');

  data.photos.forEach(p=>{
    const d=document.createElement('div');
    d.className='gallery-item';
    d.innerHTML=`<img src="${p.src}"><div class="gallery-overlay"><span>${p.title}</span></div>`;
    d.onclick=()=>openLightbox('img',p.src);
    photos.appendChild(d);
  });

  data.videos.forEach(v=>{
    const d=document.createElement('div');
    d.className='gallery-item';
    d.innerHTML=`<video src="${v.src}" muted loop preload="metadata"></video><div class="gallery-overlay"><span>${v.title}</span></div>`;
    d.onclick=()=>openLightbox('video',v.src);
    videos.appendChild(d);
  });

  document.querySelectorAll('.gallery-item video').forEach(video=>{
    video.parentElement.addEventListener('mouseenter',()=>{
      video.muted=true;
      video.play();
    });
    video.parentElement.addEventListener('mouseleave',()=>{
      video.pause();
      video.currentTime=0;
    });
  });

  function openLightbox(type,src){
    content.querySelectorAll('img,video').forEach(e=>e.remove());

    if(type==='img'){
      const img=document.createElement('img');
      img.src=src;
      content.appendChild(img);
    }else{
      const video=document.createElement('video');
      video.src=src;
      video.controls=true;
      video.autoplay=true;
      video.muted=false;
      content.appendChild(video);
    }
    lightbox.classList.add('active');
  }

  close.onclick=()=>lightbox.classList.remove('active');
  lightbox.onclick=e=>{
    if(e.target===lightbox) lightbox.classList.remove('active');
  };
});
</script>

<!-- Changeble Background Code -->
<script>
document.addEventListener("DOMContentLoaded",()=>{
  const hero=document.querySelector(".page-hero");
  if(!hero)return;
  const backgrounds=[
    "images/background/bg1.jpg",
    "images/background/bg2.jpg",
    "images/background/bg3.jpg",
    "images/background/bg4.jpg",
    "images/background/bg5.jpg"
  ];
  let i=0;
  function rotate(){
    hero.style.backgroundImage=
      "linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.85)),url('"+backgrounds[i]+"')";
    i=(i+1)%backgrounds.length;
  }
  rotate();
  setInterval(rotate,6000);
});
</script>
</body>
</html>
