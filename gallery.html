<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | Flash Line Cargo</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Montserrat:wght@900&display=swap');

*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}

body{
  background: radial-gradient(circle at top, #1a3b5d, #0b1620 70%);
  color:#fff;
  overflow-x:hidden;
}

header{
  background:rgba(15,32,39,.6);
  backdrop-filter:blur(14px);
  padding:20px 50px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  display:flex;
  gap:15px;
  align-items:center;
}

.logo img{
  width:70px;height:70px;border-radius:50%;
  box-shadow:0 0 25px rgba(255,204,0,.8);
}

header h1{
  font-family:Montserrat;
  font-size:30px;
  background:linear-gradient(90deg,#ffcc00,#ff9900);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

nav a{
  color:#fff;
  text-decoration:none;
  margin-left:25px;
}

.page-hero{
  padding:120px 20px;
  text-align:center;
  background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.9)),url("images/branches-bg.jpg") center/cover;
}

.page-hero h2{
  font-size:48px;
  background:linear-gradient(90deg,#ffcc00,#fff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.section{
  padding:80px 40px;
  background:#fff;
}

.section.dark{background:#f4f4f4}

.section-title{
  text-align:center;
  color:#0f2027;
  font-size:40px;
  margin-bottom:50px;
}

.gallery-grid{
  max-width:1200px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:30px;
}

.gallery-item{
  position:relative;
  border-radius:20px;
  overflow:hidden;
  cursor:pointer;
  box-shadow:0 20px 40px rgba(0,0,0,.2);
}

.gallery-item img,
.gallery-item video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.gallery-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.7),transparent);
  opacity:0;
  display:flex;
  align-items:flex-end;
  padding:20px;
  transition:.3s;
}

.gallery-item:hover .gallery-overlay{opacity:1}

footer{
  background:#0b1620;
  padding:40px;
  text-align:center;
}

/* LIGHTBOX */
.lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}
.lightbox.active{
  opacity:1;
  pointer-events:auto;
}
.lightbox-content{
  max-width:90%;
  max-height:90%;
  position:relative;
}
.lightbox img,
.lightbox video{
  width:100%;
  max-height:90vh;
  border-radius:20px;
  box-shadow:0 0 60px rgba(255,204,0,.5);
}
.lightbox-close{
  position:absolute;
  top:-50px;
  right:0;
  font-size:40px;
  cursor:pointer;
  color:#fff;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="images/logo.png">
    <h1>Flash Line Cargo</h1>
  </div>
  <nav>
    <a href="home.html">Home</a>
    <a href="tracking.html">Tracking</a>
    <a href="gallery.html">Gallery</a>
    <a href="about.html">About</a>
    <a href="branches.html">Contact</a>
  </nav>
</header>

<section class="page-hero">
  <h2>Our Gallery</h2>
  <p>Real customer. Real experience.</p>
</section>

<section class="section">
  <h2 class="section-title">Photo Gallery</h2>
  <div class="gallery-grid" id="photoGallery"></div>
</section>

<section class="section dark">
  <h2 class="section-title">Video Gallery</h2>
  <div class="gallery-grid" id="videoGallery"></div>
</section>

<footer>
  © 2026 Flash Line Cargo Service
</footer>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-content" id="lightboxContent">
    <span class="lightbox-close" id="lightboxClose">×</span>
  </div>
</div>

<script>
fetch('gallery.json')
.then(res=>res.json())
.then(data=>{

  const photos=document.getElementById('photoGallery');
  const videos=document.getElementById('videoGallery');
  const lightbox=document.getElementById('lightbox');
  const content=document.getElementById('lightboxContent');
  const close=document.getElementById('lightboxClose');

  data.photos.forEach(p=>{
    const d=document.createElement('div');
    d.className='gallery-item';
    d.innerHTML=`<img src="${p.src}"><div class="gallery-overlay"><span>${p.title}</span></div>`;
    d.onclick=()=>openLightbox('img',p.src);
    photos.appendChild(d);
  });

  data.videos.forEach(v=>{
    const d=document.createElement('div');
    d.className='gallery-item';
    d.innerHTML=`<video src="${v.src}" muted loop preload="metadata"></video><div class="gallery-overlay"><span>${v.title}</span></div>`;
    d.onclick=()=>openLightbox('video',v.src);
    videos.appendChild(d);
  });

  document.querySelectorAll('.gallery-item video').forEach(video=>{
    video.parentElement.addEventListener('mouseenter',()=>{
      video.muted=true;
      video.play();
    });
    video.parentElement.addEventListener('mouseleave',()=>{
      video.pause();
      video.currentTime=0;
    });
  });

  function openLightbox(type,src){
    content.querySelectorAll('img,video').forEach(e=>e.remove());

    if(type==='img'){
      const img=document.createElement('img');
      img.src=src;
      content.appendChild(img);
    }else{
      const video=document.createElement('video');
      video.src=src;
      video.controls=true;
      video.autoplay=true;
      video.muted=false;
      content.appendChild(video);
    }
    lightbox.classList.add('active');
  }

  close.onclick=()=>lightbox.classList.remove('active');
  lightbox.onclick=e=>{
    if(e.target===lightbox) lightbox.classList.remove('active');
  };
});
</script>

</body>
</html>
