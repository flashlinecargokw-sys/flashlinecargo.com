<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Flash Line Cargo</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    .login-container {
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      width: 100%;
      max-width: 350px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .login-container label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #555;
    }

    .login-container input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
      box-sizing: border-box;
    }

    .login-container input:focus {
      outline: none;
      border-color: #667eea;
    }

    .login-container button {
      width: 100%;
      padding: 12px;
      background: #667eea;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .login-container button:hover {
      background: #5a67d8;
    }
    
    .error-message {
      color: #e53e3e;
      text-align: center;
      display: none;
      margin-top: 10px;
      font-size: 14px;
      background: #fed7d7;
      padding: 8px;
      border-radius: 4px;
    }
    
    .debug-info {
      margin-top: 15px;
      padding: 10px;
      background: #f0f0f0;
      border-radius: 4px;
      font-size: 12px;
      color: #666;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>🔐 Flash Line Cargo Login</h2>
    <form onsubmit="return handleLogin(event)">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter admin" value="admin" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter 123456" value="123456" required />

      <button type="submit">Login</button>
      <p id="error-message" class="error-message"></p>
      
      <!-- Debug panel (remove in production) -->
      <div id="debug-info" class="debug-info">
        <strong>Debug Info:</strong><br>
        Current: <span id="current-path"></span><br>
        Trying: <span id="target-path"></span>
      </div>
    </form>
  </div>
