<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    .login-container {
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      width: 100%;
      max-width: 350px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .login-container label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #555;
    }

    .login-container input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
      box-sizing: border-box;
    }

    .login-container input:focus {
      outline: none;
      border-color: #667eea;
    }

    .login-container button {
      width: 100%;
      padding: 12px;
      background: #667eea;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .login-container button:hover {
      background: #5a67d8;
    }

    .login-container .footer {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .login-container .footer a {
      color: #667eea;
      text-decoration: none;
    }

    .login-container .footer a:hover {
      text-decoration: underline;
    }
    
    .error-message {
      color: #e53e3e;
      text-align: center;
      display: none;
      margin-top: 10px;
      font-size: 14px;
      background: #fed7d7;
      padding: 8px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Login</h2>
    <form action="#" method="post" onsubmit="return validateForm()">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter your username" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required />

      <button type="submit">Login</button>
      <p id="error-message" class="error-message"></p>
    </form>
  </div>
  
  <script>
    // Set your credentials here (for demo purposes)
    const VALID_USERNAME = "admin";
    const VALID_PASSWORD = "123456";
    
    function validateForm() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim(); // Fixed: added .value
      const errorMessage = document.getElementById("error-message");
      
      // Check if fields are empty
      if (username === "" || password === "") {
        errorMessage.style.display = "block";
        errorMessage.textContent = "Username and password are required.";
        return false;
      }
      
      // Check credentials
      if (username === VALID_USERNAME && password === VALID_PASSWORD) {
        // Success: redirect to cargo admin panel page
        errorMessage.style.display = "none";
        window.location.href = "cargo_admin_panel.html"; // Change this to your home page
        return false; // Prevent form submission since we're redirecting
      } else {
        // Failed: show error
        errorMessage.style.display = "block";
        errorMessage.textContent = "Incorrect username or password.";
        return false;
      }
    }
  </script>
</body>
</html>
